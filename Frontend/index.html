<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- School Favicon -->
    <link rel="icon" type="image/svg+xml" href="/images/school-logo.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Mayfield Global School | Quality Education & Excellence
    </title>

    <meta
      name="description"
      content="Mayfield Global School is committed to providing quality education, academic excellence, holistic development, and a nurturing environment for students."
    />

    <meta
      name="keywords"
      content="Mayfield Global School, school, education, best school, quality education, academic excellence, student development, school admission"
    />

    <meta name="author" content="Mayfield Global School" />

    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://mayfieldglobalschool.com/"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#005E8A" />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Mayfield Global School | Quality Education & Excellence"
    />

    <meta
      property="og:description"
      content="Discover quality education, academic excellence, and holistic student development at Mayfield Global School."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://mayfieldglobalschool.com/"
    />

    <meta
      property="og:image"
      content="https://mayfieldglobalschool.com/og-image.jpg"
    />

    <meta
      property="og:site_name"
      content="Mayfield Global School"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Mayfield Global School | Quality Education & Excellence"
    />

    <meta
      name="twitter:description"
      content="Quality education, academic excellence, and holistic development at Mayfield Global School."
    />

    <meta
      name="twitter:image"
      content="https://mayfieldglobalschool.com/og-image.jpg"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
